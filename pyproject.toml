[project]
name = "rag-final"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "pandas>=2.3.3",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.7",
    "sentence-transformers>=6.0.1",
    "slowapi>=0.1.10",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
rag-final = "rag_final:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
